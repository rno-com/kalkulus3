<title>Volume Benda Putar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: header bar · one slide at a time (visual left 58%, reasoning right 42%) · footer navigation with 24-segment progress */
:root{
  --bg:#FFFFFF; --surface:#F2F6F5; --surface-2:#E4EDEB; --ink:#15272A; --muted:#55686B; --line:#CFDCDA; --grid:#E3EBEA;
  --brand:#2B7A6E; --brand-ink:#FFFFFF; --brand-soft:#DCEDE9;
  --curve:#1F5FBF; --region-fill:rgba(31,95,191,.17); --overlay-fill:rgba(19,141,90,.16);
  --slice:#D97B12; --axis-rot:#C0392B; --r-inner:#8E44AD; --height:#138D5A;
  --ok:#137A4E; --ok-soft:#E2F3EA; --warn:#9A6208; --warn-soft:#FBF0DA; --err:#B3261E; --err-soft:#FBE5E2;
  --solid3d:#7F9DB5; --surface3d:#F2F6F5; --axis3d:#8A9C9F;
  --font-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F191B; --surface:#162325; --surface-2:#1D2E31; --ink:#E3EEEC; --muted:#9BB0B1; --line:#2B3F42; --grid:#1F3033;
  --brand:#5CB5A6; --brand-ink:#0B1A19; --brand-soft:#1B3A35;
  --curve:#77A6F2; --region-fill:rgba(119,166,242,.2); --overlay-fill:rgba(76,195,138,.2);
  --slice:#F0A04B; --axis-rot:#F27A6C; --r-inner:#C590E4; --height:#4CC38A;
  --ok:#4CC38A; --ok-soft:#15332A; --warn:#E8B451; --warn-soft:#382C13; --err:#F27A6C; --err-soft:#3C1E1B;
  --solid3d:#6D8CA6; --surface3d:#162325; --axis3d:#6C8285; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F191B; --surface:#162325; --surface-2:#1D2E31; --ink:#E3EEEC; --muted:#9BB0B1; --line:#2B3F42; --grid:#1F3033;
  --brand:#5CB5A6; --brand-ink:#0B1A19; --brand-soft:#1B3A35;
  --curve:#77A6F2; --region-fill:rgba(119,166,242,.2); --overlay-fill:rgba(76,195,138,.2);
  --slice:#F0A04B; --axis-rot:#F27A6C; --r-inner:#C590E4; --height:#4CC38A;
  --ok:#4CC38A; --ok-soft:#15332A; --warn:#E8B451; --warn-soft:#382C13; --err:#F27A6C; --err-soft:#3C1E1B;
  --solid3d:#6D8CA6; --surface3d:#162325; --axis3d:#6C8285; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
.brandmark{display:flex;align-items:baseline;gap:10px;min-width:0}
.brandmark b{font-family:var(--font-display);font-size:19px;white-space:nowrap}
.brandmark span{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .grow{flex:1}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-inline:20px;padding-block:20px 32px}
.slide{max-width:1280px;margin:0 auto}
.footbar{flex:none;display:flex;align-items:center;gap:12px;padding:10px 20px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.segs{flex:1;display:grid;grid-template-columns:repeat(24,1fr);gap:3px;min-width:0}
.seg{height:10px;border:0;border-radius:3px;background:var(--surface-2);padding:0;cursor:pointer}
.seg.v{background:color-mix(in srgb,var(--brand) 38%,var(--surface-2))}
.seg.d{background:var(--brand)}
.seg.cur{outline:2px solid var(--ink);outline-offset:1px}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;font-size:15px;letter-spacing:.01em}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:34px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.caps{text-transform:uppercase;font-size:13.5px;letter-spacing:.05em}

/* slide head */
.sh{display:grid;gap:4px;margin-bottom:18px;max-width:72ch}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-weight:700}
.eyebrow .src{color:var(--muted);font-weight:600;letter-spacing:.04em}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:clamp(24px,2.6vw,31px)}
h3{font-size:19px;margin-bottom:6px}
.lead{margin:4px 0 0;color:var(--muted);font-size:17.5px}
p{margin:0 0 10px}
.cols{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(0,1fr);gap:24px;align-items:start}
.stack{display:grid;gap:16px;min-width:0}
.card{background:var(--surface);border-radius:var(--radius);padding:16px 18px;min-width:0}
.card.plain{background:transparent;border:1px solid var(--line)}
.formula{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;font-size:20px;overflow-x:auto}
.formula.big{font-size:23px}
.formula .cap{display:block;font-size:13px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.tag.add{background:var(--warn-soft);color:var(--warn)}
.tag.ctx{background:var(--overlay-fill);color:var(--height)}
details.note{font-size:14.5px;color:var(--muted);border-left:3px solid var(--line);padding:4px 0 4px 12px}
details.note summary{cursor:pointer;font-weight:600}
.k-R{color:var(--curve);font-weight:700}.k-r{color:var(--r-inner);font-weight:700}.k-h{color:var(--height);font-weight:700}.k-s{color:var(--slice);font-weight:700}.k-ax{color:var(--axis-rot);font-weight:700}
ul.clean,ol.clean{margin:0;padding-left:20px;display:grid;gap:4px}

/* segmented */
.segc{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.segc button{border:0;background:var(--bg);padding:6px 12px;min-height:36px;cursor:pointer;font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.segc button+button{border-left:1px solid var(--line)}
.segc button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

/* lab */
.lab{display:grid;gap:12px;min-width:0}
.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.views.one{grid-template-columns:1fr}
.view{margin:0;background:var(--surface);border-radius:var(--radius);overflow:hidden;position:relative;min-width:0}
.view figcaption{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px 0}
.view figcaption i{font-style:normal;font-weight:600;letter-spacing:0;text-transform:none}
.view svg.g2{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.c3d{width:100%;aspect-ratio:420/360;position:relative;touch-action:none;cursor:grab}
.c3d canvas{display:block;width:100%!important;height:100%!important}
.no3d{padding:24px;color:var(--muted);font-size:14px}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.ctrl label.rng{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;flex:1 1 220px;min-width:0}
.ctrl input[type=range]{flex:1;min-width:0;accent-color:var(--slice);height:30px}
.ctrl .lbl{font-size:14px;color:var(--muted);font-weight:700}
.layers{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13.5px;background:var(--bg);cursor:pointer;min-height:32px}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--ink)}
.read{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px;margin:0;font-variant-numeric:tabular-nums;background:var(--surface);border-radius:var(--radius);padding:12px 16px}
.read div{min-width:0}
.read dt{font-size:13.5px;color:var(--muted);font-weight:600}
.read dd{margin:0;font-size:16.5px;font-weight:600}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:var(--bg)}
.step.locked{opacity:.5}
.step.locked .sbody{display:none}
.step.active{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.step.done{background:var(--surface)}
.shead{display:flex;gap:10px;align-items:baseline}
.snum{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:700;background:var(--surface-2);font-variant-numeric:tabular-nums}
.step.done .snum{background:var(--brand);color:var(--brand-ink)}
.stitle{font-weight:700}
.sbody{margin-top:8px;display:grid;gap:10px}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:42px;font-size:16px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt.okk{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--err);background:var(--err-soft)}
.inrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inrow .pre{font-weight:600}
.inp{border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:42px;min-width:0;width:200px;max-width:100%;background:var(--bg);font-size:17px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.fb{border-radius:8px;padding:8px 12px;font-size:15.5px}
.fb:empty{display:none}
.fb.ok{background:var(--ok-soft);color:var(--ink);border-left:4px solid var(--ok)}
.fb.warn{background:var(--warn-soft);border-left:4px solid var(--warn)}
.fb.err{background:var(--err-soft);border-left:4px solid var(--err)}
.fb b.st{margin-right:6px}
.fb.ok b.st{color:var(--ok)}.fb.warn b.st{color:var(--warn)}.fb.err b.st{color:var(--err)}
.hints{font-size:15px;border-left:3px solid var(--slice);padding-left:10px;display:grid;gap:4px}
.hints:empty{display:none}
.sol{font-size:16px;border-top:1px dashed var(--line);padding-top:8px}
.sol:empty{display:none}

/* builder */
.builder{display:grid;gap:12px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.slot{display:grid;gap:4px;font-size:14px;font-weight:700;color:var(--muted)}
.slot select{min-height:42px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg);font-size:16px;font-weight:600;color:var(--ink)}
.slot.okk select{border-color:var(--ok);background:var(--ok-soft)}
.slot.bad select{border-color:var(--err);background:var(--err-soft)}

/* cover */
.cover{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:32px;align-items:center;min-height:70vh}
.cover h1{font-size:clamp(34px,4.6vw,56px);letter-spacing:-.01em}
.cover .sub{font-size:19px;color:var(--muted)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:15.5px;margin:16px 0}
.meta dt{color:var(--muted)}.meta dd{margin:0;font-weight:600}
.map{display:grid;gap:6px;margin-top:8px}
.map button{display:flex;gap:12px;align-items:baseline;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 12px;cursor:pointer}
.map button:hover{background:var(--surface)}
.map b{font-family:var(--font-display);min-width:28px;color:var(--brand)}

/* flow */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14.5px}
.flow span.n{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-weight:600}
.flow span.n.hi{border-color:var(--slice);background:color-mix(in srgb,var(--slice) 14%,var(--bg))}
.flow span.a{color:var(--muted)}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15.5px}
table.t th,table.t td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:14px;font-weight:700;color:var(--muted)}
table.t tr.hi td{background:var(--brand-soft)}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:var(--surface)}
.tw{overflow-x:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--bg);border-radius:8px 8px 0 0;padding:8px 14px;cursor:pointer;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* quiz */
.qdots{display:flex;gap:6px;flex-wrap:wrap}
.qdot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.qdot.cur{border-color:var(--ink);border-width:2px}
.qdot.okk{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.qdot.bad{background:var(--err);color:var(--bg);border-color:var(--err)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.thumbs .opt svg{display:block;width:100%;height:auto}
.dnd{display:grid;gap:10px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border:1px dashed var(--line);border-radius:8px}
.item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;cursor:grab;font-weight:600;font-size:15px;min-height:44px}
.item svg{width:46px;height:34px}
.item[aria-pressed="true"]{border-color:var(--slice);box-shadow:0 0 0 2px var(--slice)}
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.target{border:1px solid var(--line);border-radius:8px;padding:8px;min-height:92px;display:grid;gap:6px;align-content:start;background:var(--surface);cursor:pointer}
.target b{font-size:14px}
.target.okk{border-color:var(--ok)}.target.bad{border-color:var(--err)}

/* menu */
dialog.menu{border:0;border-radius:14px;padding:0;max-width:min(720px,calc(100vw - 32px));width:100%;max-height:min(86vh,800px);background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog.menu::backdrop{background:rgba(10,20,22,.45)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
.mbody{padding:12px 20px 20px;display:grid;gap:14px;overflow:auto}
.mpart h4{margin:0 0 6px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--brand)}
.mpart ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.mpart button{width:100%;display:flex;gap:10px;align-items:baseline;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px;cursor:pointer}
.mpart button:hover,.mpart button.cur{background:var(--surface)}
.mpart .no{font-variant-numeric:tabular-nums;color:var(--muted);width:24px}
.mpart .st{margin-left:auto;font-size:13px;color:var(--muted)}
.mpart .st.d{color:var(--ok);font-weight:700}

.tree svg{width:100%;height:auto;display:block}
.tree .nd rect{fill:var(--bg);stroke:var(--line);stroke-width:1.2}
.tree .nd.on rect{stroke:var(--brand);stroke-width:2.2;fill:var(--brand-soft)}
.tree .nd.leaf.on rect{stroke:var(--slice);fill:color-mix(in srgb,var(--slice) 16%,var(--bg))}
.tree text{fill:var(--ink);font-size:13px}
.tree .ed{stroke:var(--line);stroke-width:1.4;fill:none}
.tree .ed.on{stroke:var(--brand);stroke-width:2.6}
.tree .el{fill:var(--muted);font-size:12px;font-weight:700}
.ring svg{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}
.sflow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;counter-reset:f}
.sflow div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:600;font-size:15px;background:var(--bg)}
.sflow div::before{counter-increment:f;content:counter(f);display:block;font-size:12px;color:var(--brand);font-weight:700}
textarea.refl{width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);resize:vertical}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;font-variant-numeric:tabular-nums}
.stats div{background:var(--surface);border-radius:8px;padding:10px 12px}
.stats b{display:block;font-size:24px;font-family:var(--font-display)}
.stats span{font-size:13px;color:var(--muted)}
mjx-container[display="true"]{margin:.4em 0!important;overflow-x:auto;overflow-y:hidden}

@media (max-width:1100px){ .cols{grid-template-columns:minmax(0,1fr)} .cover{grid-template-columns:minmax(0,1fr);min-height:0} }
@media (max-width:640px){
  body{font-size:16px}
  .views{grid-template-columns:1fr}
  .topbar,.footbar{padding-inline:12px;gap:8px}
  main{padding-inline:16px}
  .brandmark span{display:none}
  .segs{gap:2px}.seg{height:8px}
  .btn.navtxt span{display:none}
}
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important;transition:none!important} }
</style>

<script>
window.MathJax = { tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]}, svg:{fontCache:'global'}, options:{enableMenu:false}, startup:{typeset:false} };
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<div class="app">
  <header class="topbar">
    <div class="brandmark"><b>Volume Benda Putar</b><span id="partLabel">Kalkulus 2 · TIN613022 · Pertemuan 3</span></div>
    <div class="grow"></div>
    <button class="btn sm" id="btnMenu" aria-haspopup="dialog">Menu</button>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="footbar">
    <button class="btn sm navtxt" id="btnPrev" aria-label="Slide sebelumnya">‹ <span>Previous</span></button>
    <div class="segs" id="segs" aria-label="Kemajuan belajar"></div>
    <span class="counter" id="counter">01 / 24</span>
    <button class="btn sm primary navtxt" id="btnNext" aria-label="Slide berikutnya"><span>Next</span> ›</button>
  </footer>
</div>
<dialog class="menu" id="menu" aria-label="Daftar slide">
  <div class="mhead"><b>Daftar slide</b><button class="btn sm" id="btnMenuClose">Tutup</button></div>
  <div class="mbody" id="menuBody"></div>
</dialog>

/* expression parsing (answers) */
function toFn(raw, v){
  let s = String(raw ?? '').toLowerCase().trim();
  if(!s) return null;
  s = s.replace(/[−–—]/g,'-').replace(/[×·∙]/g,'*').replace(/÷/g,'/').replace(/,/g,'.').replace(/π/g,'pi')
       .replace(/²/g,'^2').replace(/³/g,'^3').replace(/⁴/g,'^4').replace(/⁵/g,'^5').replace(/\s+/g,'')
       .replace(/akar/g,'sqrt').replace(/√\(/g,'sqrt(').replace(/√(pi|[a-z]|[0-9.]+)/g,'sqrt($1)');
  s = s.replace(/(\d|\))(?=[a-z(])/g,'$1*').replace(/\)(?=\d)/g,')*');
  s = s.replace(/(pi|[xy])(?=[\d(xy]|pi|sqrt)/g,'$1*');
  let t = s.replace(/sqrt|pi/g,''); if(v) t = t.replace(new RegExp('['+v+']','g'),'');
  if(/[^0-9.+\-*/^()]/.test(t)) return null;
  s = s.replace(/(^|[(*/^+\-])-/g,'$1(-1)*').replace(/\^/g,'**');
  try{
    const f = new Function(v||'_','pi','sqrt','"use strict";return ('+s+');');
    const g = (val)=>f(val, Math.PI, Math.sqrt);
    const test = g(1.37); if(typeof test!=='number') return null;
    return g;
  }catch(e){ return null; }
}
function sameFn(f, g, dom=[0.2,1.9]){
  if(!f||!g) return false;
  for(let i=0;i<7;i++){
    const x = dom[0] + (dom[1]-dom[0])*(i+0.37)/7;
    const a=f(x), b=g(x);
    if(!isFinite(a)||!isFinite(b)) return false;
    if(Math.abs(a-b) > 1e-6*Math.max(1,Math.abs(b))) return false;
  }
  return true;
}
function evalNum(raw){ const f = toFn(raw,''); if(!f) return null; const v = f(0); return isFinite(v)? v : null; }

function revolveInto(out, poly, theta, segs, map, caps=true){
  const n = poly.length;

    if(Math.abs(p[1])<1e-9 && Math.abs(q[1])<1e-9) continue;
    const base = out.pos.length/3;
    for(let k=0;k<=segs;k++){ const f=theta*k/segs; out.pos.push(...map(p[0],p[1],f), ...map(q[0],q[1],f)); }
    for(let k=0;k<segs;k++){ const a=base+2*k; out.idx.push(a,a+2,a+1, a+1,a+2,a+3); }
  }

    const tris = THREE.ShapeUtils.triangulateShape(poly.map(v=>new THREE.Vector2(v[0],v[1])), []);
    for(const f of [0, theta]){
      const base = out.pos.length/3;
      for(const v of poly) out.pos.push(...map(v[0],v[1],f));

  rebuildDynamic(){
    const V=this.viewer; if(!V||!V.mounted) return;
    const c=this.c, map=trMap(c), m=c[this.method];
    V.clear(this.solidM); this.solidM=null; V.clear(this.elemM); this.elemM=null;
    const e=this.elem(), elemOn = e && this.showElement;
    if(this.showSolid && this.thS>1e-3){
      const out={pos:[],idx:[]};
      if(this.mode==='slices' && m){
        const [a,b]= this.method==='disk'? m.t : m.p, d=(b-a)/this.n, gap=d*0.07, segs=this.n>20?40:56;
        for(let i=0;i<this.n;i++){ const u0=a+i*d, um=u0+d/2; let rc;
          if(this.method==='disk') rc=[[u0+gap,m.ri(um)],[u0+d-gap,m.ri(um)],[u0+d-gap,m.ro(um)],[u0+gap,m.ro(um)]];
          else rc=[[m.lo(um),u0+gap],[m.hi(um),u0+gap],[m.hi(um),u0+d-gap],[m.lo(um),u0+d-gap]];

        this.M.solid.opacity = elemOn? .26 : .92; this.M.solid.depthWrite = !elemOn;
        this.solidM=new THREE.Mesh(geoFrom(out), this.M.solid);
      }
      V.scene.add(this.solidM);
    }
    if(elemOn && this.thE>1e-3){ const out={pos:[],idx:[]}; revolveInto(out, e.rect, this.thE, 72, map); this.elemM=new THREE.Mesh(geoFrom(out), this.M.elem); V.scene.add(this.elemM); }
    if(this.regionMesh) this.regionMesh.visible = this.layers.region;
  }
  animate(key, dur=2600){ this[key]=0; this.anims=this.anims.filter(a=>a.key!==key); this.anims.push({key,from:0,to:TAU,t0:performance.now(),dur:RM?0:dur}); this.dirty=true; if(!this.viewer||!this.viewer.mounted) this[key]=TAU; }
  sweepSolid(){ this.showSolid=true; this.animate('thS'); this.render2D(); this.o.onChange&&this.o.onChange(this); }
  sweepElement(){ if(!this.c[this.method]) return; this.showElement=true; this.animate('thE',1800); this.render2D(); this.renderRead(); }
}

/* =========================================================

const L_ID = {check:'Periksa', hint:'Petunjuk', retry:'Ulangi', sol:'Tunjukkan jawaban', next:'Langkah berikutnya'};
const L_EN = {check:'Check answer', hint:'Show hint', retry:'Try again', sol:'Show solution', next:'Next step'};
class Steps{
  constructor(host, o){ this.host=host; this.o=o; this.L=o.labels||L_ID; this.st=o.steps.map(()=>({done:false,hint:0,tries:0,sel:null})); this.render(); }
  render(){
    const L=this.L;
    this.host.innerHTML=`<ol class="steps">${this.o.steps.map((s,i)=>`<li class="step" data-i="${i}">
      <div class="shead"><span class="snum">${i+1}</span><div><div class="stitle">${s.title}</div></div></div>
      <div class="sbody">${s.q?`<div>${s.q}</div>`:''}${this.inputHTML(s,i)}
        <div class="btns">${s.type==='info'?`<button type="button" class="btn sm primary caps" data-b="next">${L.next}</button>`:
          `<button type="button" class="btn sm primary caps" data-b="check">${L.check}</button><button type="button" class="btn sm caps" data-b="hint">${L.hint}</button><button type="button" class="btn sm caps" data-b="retry">${L.retry}</button><button type="button" class="btn sm caps ghost" data-b="sol">${L.sol}</button>`}</div>
        <div class="hints"></div><div class="fb" role="status"></div><div class="sol"></div></div></li>`).join('')}</ol>`;
    $$('.step',this.host).forEach(li=>{
      const i=+li.dataset.i, s=this.o.steps[i];
      li.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; if(this.st[i].done) return;
        if(b.classList.contains('opt')){ this.st[i].sel=+b.dataset.o; $$('.opt',li).forEach(x=>{ x.setAttribute('aria-pressed', x===b); x.classList.remove('okk','bad'); }); return; }
        const a=b.dataset.b; if(a==='check') this.check(i); else if(a==='hint') this.hint(i); else if(a==='retry') this.retry(i); else if(a==='sol') this.reveal(i); else if(a==='next') this.solve(i,'ok'); });
      const inp=$('input.inp',li); if(inp) inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); this.check(i); } });
    });
    this.update(); typeset(this.host);
  }
  inputHTML(s,i){
    if(s.type==='choice') return `<div class="opts">${s.options.map((op,k)=>`<button type="button" class="opt" data-o="${k}" aria-pressed="false">${op.t}</button>`).join('')}</div>`;
    if(s.type==='expr'||s.type==='num') return `<div class="inrow">${s.pre?`<span class="pre">${s.pre}</span>`:''}<input class="inp" type="text" inputmode="text" autocomplete="off" spellcheck="false" id="${uid('in')}" placeholder="${esc(s.ph||(s.type==='num'?'contoh: 32π/5':'contoh: x^2'))}" aria-label="${esc(s.aria||'Jawaban')}"></div>`;
    return '';
  }
  li(i){ return $(`.step[data-i="${i}"]`,this.host); }
  update(){
    let firstOpen=-1;
    this.st.forEach((s,i)=>{ const li=this.li(i); const open = !s.done && firstOpen<0; if(open) firstOpen=i;
      li.classList.toggle('done',s.done); li.classList.toggle('active',open); li.classList.toggle('locked', !s.done && !open);
      const bt=$('.btns',li); if(bt) bt.hidden=s.done; const inp=$('input.inp',li); if(inp) inp.readOnly=s.done; $$('.opt',li).forEach(o=>o.tabIndex=s.done?-1:0); li.dataset.done=s.done?'1':''; });
    if(firstOpen<0 && !this._fin){ this._fin=true; this.o.onDone && this.o.onDone(); }
  }
  fb(i, kind, msg){ const f=$('.fb',this.li(i)); const st={ok:'Benar.',warn:'Hampir.',err:'Belum tepat.'}[kind]; f.className='fb '+kind; f.innerHTML=`<b class="st">${st}</b>${msg||''}`; typeset(f); }
  check(i){
    const s=this.o.steps[i], li=this.li(i), S=this.st[i]; if(S.done) return;
    if(s.type==='choice'){
      if(S.sel==null){ this.fb(i,'warn','Pilih salah satu jawaban terlebih dahulu.'); return; }
      S.tries++; const op=s.options[S.sel], b=$(`.opt[data-o="${S.sel}"]`,li);
      if(op.ok){ b.classList.add('okk'); this.solve(i,'ok',op.fb); } else { b.classList.add('bad'); this.fb(i,'err',op.fb||'Coba periksa kembali gambar dan definisinya.'); this.update(); }
      return;
    }
    const raw=$('input.inp',li).value;
    if(!raw.trim()){ this.fb(i,'warn','Tuliskan jawaban terlebih dahulu.'); return; }
    S.tries++;
    if(s.type==='expr'){
      const f=toFn(raw, s.v||'x'); if(!f){ this.fb(i,'warn','Ekspresi belum terbaca. Gunakan ^ untuk pangkat dan sqrt( ) atau √ untuk akar, misalnya 1+x^2 atau 2-sqrt(y).'); this.update(); return; }
      const ans=toFn(s.ans, s.v||'x');
      if(sameFn(f,ans,s.dom)){ this.solve(i,'ok',s.okMsg); return; }
      for(const w of (s.wrong||[])){ if(sameFn(f,toFn(w.e,s.v||'x'),s.dom)){ this.fb(i,'err',w.msg); this.update(); return; } }
      this.fb(i,'err',s.failMsg||'Ekspresi ini belum sesuai. Gunakan petunjuk bila perlu.'); this.update(); return;
    }
    if(s.type==='num'){
      const v=evalNum(raw); if(v==null){ this.fb(i,'warn','Angka belum terbaca. Contoh penulisan: 32π/5, 32pi/5, atau 8π.'); this.update(); return; }
      const hasPi=/π|pi/i.test(raw), A=s.ans.v, rel=Math.abs(v-A)/Math.abs(A);
      if(rel<1e-6 && (hasPi || !s.ans.pi)){ this.solve(i,'ok',s.okMsg); return; }
      if(rel<5e-3){ this.fb(i,'warn',`Nilainya sudah tepat. Tuliskan dalam bentuk eksak${s.ans.pi?' dengan π':''}, bukan desimal.`); this.update(); return; }
      for(const w of (s.wrong||[])){ if(Math.abs(v-w.v)/Math.abs(w.v)<1e-4){ this.fb(i,'err',w.msg); this.update(); return; } }
      this.fb(i,'err',s.failMsg||'Hasilnya belum sesuai. Periksa integran dan substitusi batasnya.'); this.update(); return;
    }
  }
  solve(i, kind, msg){ const S=this.st[i], s=this.o.steps[i]; S.done=true; if(s.type!=='info') this.fb(i,kind||'ok',msg||''); if(s.sol){ const so=$('.sol',this.li(i)); so.innerHTML=s.sol; typeset(so); } s.onSolve && s.onSolve(); this.update(); }
  hint(i){ const s=this.o.steps[i], S=this.st[i]; const H=s.hints||[]; if(!H.length){ this.fb(i,'warn','Tidak ada petunjuk tambahan untuk langkah ini.'); return; } if(S.hint<H.length){ S.hint++; addHint(); }
    const box=$('.hints',this.li(i)); box.innerHTML=H.slice(0,S.hint).map((h,k)=>`<div><b>Petunjuk ${k+1}.</b> ${h}</div>`).join('')+(S.hint>=H.length?'':''); typeset(box); }
  retry(i){ const li=this.li(i); this.st[i].sel=null; $$('.opt',li).forEach(x=>{ x.setAttribute('aria-pressed','false'); x.classList.remove('okk','bad'); }); const inp=$('input.inp',li); if(inp){ inp.value=''; inp.focus(); } const f=$('.fb',li); f.className='fb'; f.innerHTML=''; }
  reveal(i){ const s=this.o.steps[i]; if(s.revealAfterAttempt && this.st[i].tries===0){ this.fb(i,'warn','Coba jawab sekali dulu, lalu jawaban dapat ditampilkan.'); return; }
    if(s.type==='choice'){ const k=s.options.findIndex(o=>o.ok); const b=$(`.opt[data-o="${k}"]`,this.li(i)); $$('.opt',this.li(i)).forEach(x=>x.classList.remove('bad')); b.classList.add('okk'); }
    else if(s.type!=='info'){ const inp=$('input.inp',this.li(i)); if(inp) inp.value=s.show||s.ans.text||s.ans; }
    this.solve(i,'ok','Jawaban ditampilkan. Pelajari alasannya sebelum lanjut.'); }
  resetAll(){ this._fin=false; this.st=this.o.steps.map(()=>({done:false,hint:0,tries:0,sel:null})); this.render(); }
}

class Builder{

  render(){

    this.host.innerHTML=`<div class="builder"><div class="formula big" aria-live="polite"></div>
      <div class="slots">${o.slots.map(s=>`<label class="slot" data-s="${s.id}">${s.label}<select id="${uid('sel')}"><option value="">— pilih —</option>${s.opts.map(v=>`<option value="${esc(v.v)}">${esc(v.t)}</option>`).join('')}</select></label>`).join('')}</div>

    $$('select',this.host).forEach(s=>s.addEventListener('change',()=>{ s.closest('.slot').classList.remove('okk','bad'); this.ok=false; this.preview(); }));

  vals(){ const v={}; $$('.slot',this.host).forEach(l=>v[l.dataset.s]=$('select',l).value); return v; }
  preview(){ const f=$('.formula',this.host); f.innerHTML='\\['+this.o.tex(this.vals())+'\\]'; typeset(f); }

      if(!v[s.id]){ ok=false; msgs.push(`<li>${s.label}: belum dipilih.</li>`); continue; }
      if(v[s.id]===s.key) l.classList.add('okk'); else { ok=false; l.classList.add('bad'); msgs.push(`<li>${s.label}: ${s.fb(v[s.id],v)}</li>`); } }
    const f=$('.fb',this.host);
    if(ok){ f.className='fb ok'; f.innerHTML='<b class="st">Benar.</b>Integral volume sudah tersusun dengan tepat. Tekan HITUNG untuk menyelesaikannya.'; this.ok=true; this.o.onCorrect&&this.o.onCorrect(); }
    else { f.className='fb err'; f.innerHTML='<b class="st">Belum tepat.</b>Perbaiki bagian yang ditandai merah:<ul class="clean">'+msgs.join('')+'</ul>'; }

  }
  hint(){ const H=this.o.hints; if(this.hintN<H.length){ this.hintN++; addHint(); } const b=$('.hints',this.host); b.innerHTML=H.slice(0,this.hintN).map((h,k)=>`<div><b>Petunjuk ${k+1}.</b> ${h}</div>`).join(''); typeset(b); }
  calc(){ if(!this.ok){ const f=$('.fb',this.host); f.className='fb warn'; f.innerHTML='<b class="st">Hampir.</b>Susun integralnya dulu, lalu tekan PERIKSA. HITUNG menampilkan penyelesaian setelah susunannya benar.'; return; } const s=$('.sol',this.host); s.innerHTML=this.o.compute; typeset(s); this.o.onCalc&&this.o.onCalc(); }
  reset(){ this.hintN=0; this.ok=false; this.render(); }

function sectionSVG(c, label){

  const all=pts.concat(mir); let x0=Math.min(...all.map(p=>p[0]),0), x1=Math.max(...all.map(p=>p[0]),0), y0=Math.min(...all.map(p=>p[1]),0), y1=Math.max(...all.map(p=>p[1]),0);
  const pd=0.15*Math.max(x1-x0,y1-y0); x0-=pd;x1+=pd;y0-=pd;y1+=pd; const W=200,H=150, s=Math.min(W/(x1-x0),H/(y1-y0));
  const X=x=>(W-(x1-x0)*s)/2+(x-x0)*s, Y=y=>(H-(y1-y0)*s)/2+(y1-y)*s; const pa=p=>'M'+p.map(q=>X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1)).join('L')+'Z';

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label||'penampang benda')}"><line x1="0" y1="${Y(0)}" x2="${W}" y2="${Y(0)}" class="g-axis" style="stroke-width:1"/><line x1="${X(0)}" y1="0" x2="${X(0)}" y2="${H}" class="g-axis" style="stroke-width:1"/><path d="${pa(pts)}" class="g-solidsec"/><path d="${pa(mir)}" class="g-solidsec"/>${ax}</svg>`;
}

class XSection{
  constructor(host,o){ this.host=host; this.o=o; this.shape='sq'; this.n=20; this.x=1.5; this.v=new Viewer3D(host,{th:1.0,ph:1.05}); }
  mount(){ if(!this.v.mount()) return; this.v.fit([1,1.1,0.6],4.6); this.v.onTheme=()=>{this.build();}; this.build(); }
  unmount(){ this.v.unmount(); }
  set(p){ Object.assign(this,p); if(this.v.mounted) this.build(); }
  build(){
    const V=this.v; V.clear(this.g); const g=new THREE.Group(); this.g=g; V.scene.add(g);
    g.add(axesGroup([-0.4,-0.4,-0.4],[2.6,4.6,4.4],0.3));
    const col=n=>new THREE.Color(cssVar(n));
    const base=[]; const P=under(fq,0,2); const tris=THREE.ShapeUtils.triangulateShape(P.map(p=>new THREE.Vector2(p[0],p[1])),[]);
    const out={pos:[],idx:[]}; for(const p of P) out.pos.push(p[0],p[1],0); for(const t of tris) out.idx.push(...t);
    g.add(new THREE.Mesh(geoFrom(out),new THREE.MeshBasicMaterial({color:col('--curve'),transparent:true,opacity:.3,side:THREE.DoubleSide,depthWrite:false})));
    const mS=new THREE.MeshStandardMaterial({color:col('--solid3d'),roughness:.6,transparent:true,opacity:.75}), mE=new THREE.MeshStandardMaterial({color:col('--slice'),roughness:.5});
    const d=2/this.n, cur=clamp(Math.floor(this.x/d),0,this.n-1);
    for(let i=0;i<this.n;i++){ const xm=(i+.5)*d, s=xm*xm, w=d*0.9; let mesh;
      if(this.shape==='sq'){ mesh=new THREE.Mesh(new THREE.BoxGeometry(w,s,s), i===cur?mE:mS); mesh.position.set(xm,s/2,s/2); }
      else { const cg=new THREE.CylinderGeometry(s,s,w,48); cg.rotateZ(PI/2); mesh=new THREE.Mesh(cg,i===cur?mE:mS); mesh.position.set(xm,0,0); }
      g.add(mesh); }
  }
}

SLIDES.push({ id:'s13', part:'IV', title:'Metode Kulit Tabung', build(el){

class Unroll{
  constructor(host){ this.host=host; this.v=new Viewer3D(host,{th:0.9,ph:1.15}); this.r=1.2; this.h=1.44; this.d=0.16; this.u=0; }
  mount(){ if(!this.v.mount()) return; this.v.fit([1.2,1.0,1.4],4.6); this.v.onTheme=()=>this.build(); this.build(); }
  unmount(){ this.v.unmount(); }
  set(p){ Object.assign(this,p); if(this.v.mounted) this.build(); }
  build(){
    const V=this.v; V.clear(this.g); const g=new THREE.Group(); this.g=g; V.scene.add(g);
    g.add(axesGroup([-0.6,-0.4,-0.6],[3.4,4.4,8.4],0.3));
    const col=n=>new THREE.Color(cssVar(n)); const rot=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-0.6,0),new THREE.Vector3(0,4.6,0)]),new THREE.LineDashedMaterial({color:col('--axis-rot'),dashSize:.2,gapSize:.12})); rot.computeLineDistances(); g.add(rot);
    const r=this.r, h=this.h, d=this.d, u=Math.min(this.u,0.999), N=96, Rp=r/(1-u), out={pos:[],idx:[]};
    const P=(s,dl,y)=>{ const a=s/Rp; return [r-Rp+(Rp+dl)*Math.cos(a), y, (Rp+dl)*Math.sin(a)]; };
    const L=PI*r; const quad=(a,b,c,dd)=>{ const base=out.pos.length/3; out.pos.push(...a,...b,...c,...dd); out.idx.push(base,base+1,base+2,base,base+2,base+3); };
    for(let i=0;i<N;i++){ const s0=-L+2*L*i/N, s1=-L+2*L*(i+1)/N;
      quad(P(s0,d,0),P(s1,d,0),P(s1,d,h),P(s0,d,h)); quad(P(s0,0,0),P(s1,0,0),P(s1,0,h),P(s0,0,h));
      quad(P(s0,0,h),P(s1,0,h),P(s1,d,h),P(s0,d,h)); quad(P(s0,0,0),P(s1,0,0),P(s1,d,0),P(s0,d,0)); }
    if(u>0.01){ for(const s of [-L,L]) quad(P(s,0,0),P(s,d,0),P(s,d,h),P(s,0,h)); }
    g.add(new THREE.Mesh(geoFrom(out),new THREE.MeshStandardMaterial({color:col('--slice'),roughness:.55,side:THREE.DoubleSide})));
  }
}

SLIDES.push({ id:'s23', part:'V', title:'Quiz', build(el){

  function render(){

      body=`<div class="formula" style="font-size:18px;display:flex;flex-wrap:wrap;gap:6px;align-items:center">V = π ∫ dari ${sel('a',[['0','0'],['-1','−1'],['1','1']])} sampai ${sel('b',[['2','2'],['4','4']])} ( [ ${sel('R',[['1x2','1 + x²'],['x2','x²'],['x21','x² − 1']])} ]² − [ ${sel('r',[['1','1'],['0','0'],['x2','x²']])} ]² ) dx</div>`; }

    $$('.qdot',box).forEach(b=>b.addEventListener('click',()=>{ cur=+b.dataset.q; render(); }));
    $('#qprev',box).addEventListener('click',()=>{ cur--; render(); }); $('#qnext',box).addEventListener('click',()=>{ cur++; render(); });
    if(q.type==='dnd') wireDnd(box);
    const f=$('#qfb',box);
    if(locked && q._last) fbSet(f,R[cur],q._last);
    $('#qchk',box).addEventListener('click',()=>{
      let ok=false, msg='';

      if(q.type==='num'){ const raw=$('#qnum',box).value, v=evalNum(raw); if(v==null){ f.className='fb warn'; f.innerHTML='<b class="st">Hampir.</b>Tuliskan angka, misalnya 9π atau 9pi.'; return; }
        const rel=Math.abs(v-q.ans.v)/q.ans.v; if(rel<1e-6 && /π|pi/i.test(raw)){ ok=true; msg=q.fbOk; } else if(rel<5e-3){ f.className='fb warn'; f.innerHTML='<b class="st">Hampir.</b>Nilainya tepat; tuliskan dalam bentuk eksak dengan π.'; return; }

      if(q.type==='dnd'){ const placed={}; $$('.target',box).forEach(t=>{ const it=$('.item',t); placed[t.dataset.z]=it?it.dataset.i:null; }); if(Object.values(placed).some(x=>!x)){ f.className='fb warn'; f.innerHTML='<b class="st">Hampir.</b>Tempatkan ketiga bentuk pada metodenya.'; return; }
        ok=Object.entries(placed).every(([k,v])=>k===v); $$('.target',box).forEach(t=>t.classList.add(placed[t.dataset.z]===t.dataset.z?'okk':'bad')); msg= ok? q.fbOk : q.fbBad; }

  }
  function wireDnd(root){

    $$('.target,.pool',root).forEach(z=>{ const drop=()=>{ if(!picked) return; const ex=$('.item',z); if(ex && z.classList.contains('target')) $('.pool',root).appendChild(ex); z.appendChild(picked); picked.setAttribute('aria-pressed','false'); picked=null; };
      z.addEventListener('click',drop); z.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); drop(); } });
      z.addEventListener('dragover',e=>e.preventDefault()); z.addEventListener('drop',e=>{ e.preventDefault(); drop(); }); });
  }
  render(); score();
  return {};
}});

SLIDES.push({ id:'s24', part:'V', title:'Dari Daerah Menjadi Volume Benda Putar', build(el){

const App = {
  cur:-1, els:[], ctl:[],
  init(){
    const main=$('#main');
    SLIDES.forEach((s,i)=>{ const el=document.createElement('section'); el.className='slide'; el.id=s.id; el.hidden=true; el.setAttribute('aria-label',`Slide ${i+1}: ${s.title}`); main.appendChild(el); this.els.push(el); });
    const segs=$('#segs'); segs.innerHTML=SLIDES.map((s,i)=>`<button class="seg" data-i="${i}" aria-label="Slide ${i+1}: ${esc(s.title)}" title="${String(i+1).padStart(2,'0')} · ${esc(s.title)}"></button>`).join('');
    segs.addEventListener('click',e=>{ const b=e.target.closest('.seg'); if(b) this.go(+b.dataset.i); });
    $('#btnPrev').addEventListener('click',()=>this.go(this.cur-1)); $('#btnNext').addEventListener('click',()=>this.go(this.cur+1));
    const dlg=$('#menu'); $('#btnMenu').addEventListener('click',()=>{ this.renderMenu(); if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open',''); });
    $('#btnMenuClose').addEventListener('click',()=>dlg.close()); dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
    document.addEventListener('keydown',e=>{ const a=document.activeElement, tag=a&&a.tagName; if(['INPUT','TEXTAREA','SELECT'].includes(tag) || dlg.open) return; if(e.key==='ArrowRight') this.go(this.cur+1); if(e.key==='ArrowLeft') this.go(this.cur-1); });
    const themeUpd=()=>VIEWERS.forEach(v=>v.applyTheme());
    if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeUpd);
    new MutationObserver(themeUpd).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
    const h=location.hash.replace('#',''); const idx=SLIDES.findIndex(s=>s.id===h);
    this.go(idx>=0?idx:0);
    initMJ();
  },
  go(i){
    if(i<0||i>=SLIDES.length||i===this.cur) return;
    if(this.cur>=0){ const c=this.ctl[this.cur]; c&&c.leave&&c.leave(); this.els[this.cur].hidden=true; }
    this.cur=i; const el=this.els[i];
    if(!this.ctl[i]){ this.ctl[i]=SLIDES[i].build(el)||{}; typeset(el); }
    el.hidden=false; const c=this.ctl[i]; c.enter&&c.enter();
    if(!P.visited.includes(SLIDES[i].id)){ P.visited.push(SLIDES[i].id); saveP(); }
    $('#main').scrollTop=0;
    try{ history.replaceState(null,'','#'+SLIDES[i].id); }catch(e){}
    $('#partLabel').textContent=PARTS[SLIDES[i].part];
    $('#counter').textContent=String(i+1).padStart(2,'0')+' / 24';
    $('#btnPrev').disabled=i===0; $('#btnNext').disabled=i===SLIDES.length-1;
    this.refreshProgress();
  },
  refreshProgress(){ $$('.seg').forEach((b,i)=>{ const id=SLIDES[i].id; b.className='seg'+(P.done.includes(id)?' d':P.visited.includes(id)?' v':'')+(i===this.cur?' cur':''); }); },
  renderMenu(){
    const by={}; SLIDES.forEach((s,i)=>{ (by[s.part]=by[s.part]||[]).push([s,i]); });
    $('#menuBody').innerHTML=Object.keys(PARTS).map(p=>`<div class="mpart"><h4>${PARTS[p]}</h4><ol>${by[p].map(([s,i])=>`<li><button data-i="${i}" class="${i===this.cur?'cur':''}"><span class="no">${String(i+1).padStart(2,'0')}</span><span>${esc(s.title)}</span><span class="st ${P.done.includes(s.id)?'d':''}">${P.done.includes(s.id)?'✓ selesai':P.visited.includes(s.id)?'dikunjungi':''}</span></button></li>`).join('')}</ol></div>`).join('');
    $$('#menuBody button').forEach(b=>b.addEventListener('click',()=>{ $('#menu').close(); this.go(+b.dataset.i); }));
  }
};
App.init();
